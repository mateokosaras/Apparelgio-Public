services:
  - type: web
    name: apparelgio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: APPWRITE_ENDPOINT
        value: https://nyc.cloud.appwrite.io/v1
      - key: APPWRITE_PROJECT_ID
        value: 6aa3ef4e000648946540
      - key: AI_REQUESTS_PER_MINUTE
        value: "30"
      - key: EXTERNAL_REQUEST_TIMEOUT_MS
        value: "10000"
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: "20000"
      - key: GEMINI_MAX_ATTEMPTS
        value: "2"
      - key: GEMINI_RETRY_DELAY_MS
        value: "800"
